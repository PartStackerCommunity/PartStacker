name: windows

inputs:
  config-preset:
    required: true
  build-preset:
    required: true

runs:
  using: "composite"
  steps:
    - name: Configure PartStacker
      run: |
        cmake --preset ${{ inputs.config-preset }}
      shell: powershell

    - name: Build PartStacker
      run: |
        cmake --build --preset ${{ inputs.build-preset }} -j8
      shell: powershell
